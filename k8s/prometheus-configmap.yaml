apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "mecaniqa-iot"
        dns_sd_configs:
          - names:
              - "mecaniqa-iot-metrics.default.svc.cluster.local"
            type: A
            port: 8000
            refresh_interval: 10s
